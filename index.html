<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voice Translator Premium</title>
    
    <!-- PWA та Іконки -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#080b14">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080b14;
            --card-glass: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-title: #ffffff;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --grad-primary: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --grad-mic: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
            --glass-btn: rgba(255, 255, 255, 0.06);
            --glass-btn-hover: rgba(255, 255, 255, 0.12);
        }

        [data-theme="light"] {
            --bg-dark: #f8fafc;
            --card-glass: #ffffff;
            --card-border: rgba(226, 232, 240, 0.8);
            --text-main: #0f172a;
            --text-title: #0f172a;
            --text-muted: #64748b;
            --accent-blue: #0284c7;
            --glass-btn: #f1f5f9;
            --glass-btn-hover: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.1) 0px, transparent 50%);
            min-height: 100vh;
            margin: 0;
            padding: 16px 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .app-viewport {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Хедер */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-badge {
            width: 9px;
            height: 9px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-title);
        }

        .theme-btn {
            background: var(--glass-btn);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 14px;
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Вибір мови */
        .lang-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 6px 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        select.lang-select {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        select.lang-select option {
            background: #0f172a;
            color: #f8fafc;
        }

        .swap-btn {
            background: var(--grad-primary);
            border: none;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Розмовник */
        .express-bar {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .express-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
        }

        .express-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .express-select {
            background: var(--glass-btn);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 600;
            outline: none;
        }

        .express-chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 0 12px 2px 12px;
        }

        .express-chips::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--glass-btn);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .chip:active {
            background: var(--glass-btn-hover);
            transform: scale(0.96);
        }

        /* Картка Перекладу */
        .translation-card {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 26px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        textarea.input-area {
            width: 100%;
            height: 70px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 500;
            font-family: inherit;
            resize: none;
            outline: none;
            line-height: 1.4;
        }

        textarea.input-area::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .card-divider {
            height: 1px;
            background: var(--card-border);
            margin: 0;
        }

        .output-area {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
            min-height: 50px;
            color: var(--accent-blue);
            word-break: break-word;
        }

        /* Гармонійна лінійка дій */
        .action-row {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 6px;
            align-items: center;
            padding-top: 4px;
        }

        .icon-btn {
            background: var(--glass-btn);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .icon-btn-speak {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-blue);
        }

        .icon-btn:active {
            background: var(--glass-btn-hover);
        }

        /* Панель Керування */
        .controls-bar {
            display: grid;
            grid-template-columns: 1fr 80px;
            align-items: center;
            gap: 10px;
            margin-top: 2px;
        }

        .btn-mic-main {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--grad-mic);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(244, 63, 94, 0.4);
            justify-self: center;
        }

        .btn-mic-main:active {
            transform: scale(0.92);
        }

        .btn-translate-main {
            background: var(--grad-primary);
            border: none;
            color: white;
            border-radius: 20px;
            height: 56px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            width: 100%;
        }

        /* Анімація хвилі */
        .mic-waves {
            display: none;
            align-items: center;
            gap: 3px;
            height: 18px;
        }

        .mic-waves span {
            width: 3px;
            height: 100%;
            background: white;
            border-radius: 3px;
            animation: wave 1s ease-in-out infinite;
        }

        .mic-waves span:nth-child(2) { animation-delay: 0.15s; }
        .mic-waves span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 18px; }
        }

        .recording .mic-icon { display: none; }
        .recording .mic-waves { display: flex; }
        .recording {
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        /* Історія */
        .history-card {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 12px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .history-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 80px;
            overflow-y: auto;
        }

        .history-row {
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
        }

        .history-row-orig {
            color: var(--text-muted);
            font-size: 10px;
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        <!-- Шапка -->
        <div class="header">
            <div class="brand">
                <div class="brand-badge"></div>
                <div class="brand-title">Voice Translator</div>
            </div>
            <button class="theme-btn" onclick="vibrate(); toggleTheme();" id="themeBtn">🌙</button>
        </div>

        <!-- Мови -->
        <div class="lang-bar">
            <select class="lang-select" id="srcLang" onchange="vibrate(); updateUI();">
                <option value="uk">🇺🇦 Українська</option>
                <option value="sq">🇦🇱 Shqip</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="pl">🇵🇱 Polski</option>
                <option value="de">🇩🇪 Deutsch</option>
            </select>
            
            <button class="swap-btn" onclick="vibrate(); swapLanguages();">⇄</button>
            
            <select class="lang-select" id="tgtLang" onchange="vibrate();">
                <option value="sq">🇦🇱 Shqip</option>
                <option value="uk">🇺🇦 Українська</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="pl">🇵🇱 Polski</option>
                <option value="de">🇩🇪 Deutsch</option>
            </select>
        </div>

        <!-- Розмовник -->
        <div class="express-bar">
            <div class="express-top">
                <span class="express-label">⚡ Швидкий розмовник</span>
                <select id="quickCategory" onchange="vibrate(); changeQuickCategory(this.value);" class="express-select">
                    <option value="cafe">☕ Кафе</option>
                    <option value="market">🛒 Ринок</option>
                    <option value="taxi">🚖 Таксі</option>
                    <option value="hotel">🏠 Готель</option>
                    <option value="sos">💊 SOS</option>
                    <option value="basic">👋 Базові</option>
                </select>
            </div>
            <div class="express-chips" id="quickChips"></div>
        </div>

        <!-- Картка Перекладу -->
        <div class="translation-card" id="mainCard">
            <textarea class="input-area" id="inputText" placeholder="Введіть або продиктуйте текст..."></textarea>
            
            <div class="card-divider"></div>
            
            <div class="output-area" id="outputText">Переклад з'явиться тут...</div>
            
            <div class="action-row">
                <button class="icon-btn" onclick="vibrate(); clearInput();" title="Очистити">🗑️</button>
                <button class="icon-btn icon-btn-speak" onclick="vibrate(); speakResult();"><span id="speakTxt">🔊 Озвучити</span></button>
                <button class="icon-btn" onclick="vibrate(); copyResult();"><span id="copyTxt">📋 Копіювати</span></button>
                <button class="icon-btn" onclick="vibrate(); shareResult();"><span id="shareTxt">📲</span></button>
            </div>
        </div>

        <!-- Панель Керування -->
        <div class="controls-bar">
            <button class="btn-translate-main" id="translateBtn" onclick="vibrate(); translateText();">Перекласти</button>
            
            <button class="btn-mic-main" id="micBtn" onclick="vibrate(); toggleRecognition();">
                <span class="mic-icon">🎤</span>
                <div class="mic-waves">
                    <span></span><span></span><span></span>
                </div>
            </button>
        </div>

        <!-- Історія -->
        <div class="history-card">
            <div class="history-top">
                <span id="historyTitle">Історія</span>
                <span id="clearHistoryTxt" style="cursor:pointer;" onclick="vibrate(); clearHistory();">Очистити</span>
            </div>
            <div class="history-items" id="historyList"></div>
        </div>
    </div>

    <script>
        let isRecording = false;
        let recognition = null;

        const uiTranslations = {
            'uk': { placeholder: "Введіть або продиктуйте текст...", translate: "Перекласти", resultPlaceholder: "Переклад з'явиться тут...", speak: "🔊 Озвучити", history: "Історія", clearHistory: "Очистити", loading: "Зачекайте...", error: "Помилка перекладу", connectionError: "Помилка з’єднання" },
            'sq': { placeholder: "Shkruani ose flisni tekstin...", translate: "Përkthe", resultPlaceholder: "Përkthimi do të shfaqet këtu...", speak: "🔊 Dëgjo", history: "Historiku", clearHistory: "Pastro", loading: "Ju lutem prisni...", error: "Gabim në përkthim", connectionError: "Gabim në lidhje" },
            'en': { placeholder: "Type or dictate text...", translate: "Translate", resultPlaceholder: "Translation will appear here...", speak: "🔊 Listen", history: "History", clearHistory: "Clear", loading: "Please wait...", error: "Translation error", connectionError: "Connection error" }
        };

        const langSpeechCodes = { 'uk': 'uk-UA', 'sq': 'sq-AL', 'en': 'en-US', 'fr': 'fr-FR', 'it': 'it-IT', 'pl': 'pl-PL', 'de': 'de-DE' };

        const quickData = {
            cafe: [ { uk: "Рахунок, будь ласка", sq: "Fatura, ju lutem" }, { uk: "Це було дуже смачно!", sq: "Ishte shumë e shijshme!" }, { uk: "Воду без газу", sq: "Ujë pa gaz, ju lutem" }, { uk: "Дві кави еспресо", sq: "Dy kafe ekspres" } ],
            market: [ { uk: "Скільки це коштує?", sq: "Sa kushton kjo?" }, { uk: "Чи можна оплатити карткою?", sq: "A mund të paguaj me kartë?" }, { uk: "Ви приймаєте євро?", sq: "A pranoni euro?" } ],
            taxi: [ { uk: "Скільки до центра?", sq: "Sa kushton për në qendër?" }, { uk: "Зупиніться тут", sq: "Ndaloni këtu, ju lutem" }, { uk: "Увімкніть лічильник", sq: "Ulni taksimetrin, ju lutem" } ],
            hotel: [ { uk: "Я бронював номер", sq: "Kam rezervuar një dhomë" }, { uk: "Який пароль від Wi-Fi?", sq: "Cili është fjalëkalimi i Wi-Fi?" } ],
            sos: [ { uk: "Де найближча аптека?", sq: "Ku është farmacia më i afërt?" }, { uk: "Ліки від головного болю", sq: "Barna për dhimbje koke" } ],
            basic: [ { uk: "Добрий день", sq: "Mirëdita" }, { uk: "Дякую", sq: "Faleminderit" }, { uk: "Будь ласка", sq: "Ju lutem" } ]
        };

        function vibrate() { if (navigator.vibrate) navigator.vibrate(12); }

        function updateUI() {
            const srcLang = document.getElementById('srcLang').value;
            const t = uiTranslations[srcLang] || uiTranslations['uk'];
            document.getElementById('inputText').placeholder = t.placeholder;
            document.getElementById('translateBtn').innerText = t.translate;
            const currentOutput = document.getElementById('outputText').innerText;
            if (currentOutput.includes("з'явиться") || currentOutput.includes("shfaqet") || currentOutput.includes("appear")) {
                document.getElementById('outputText').innerText = t.resultPlaceholder;
            }
            document.getElementById('speakTxt').innerText = t.speak;
            document.getElementById('historyTitle').innerText = t.history;
            document.getElementById('clearHistoryTxt').innerText = t.clearHistory;
        }

        function changeQuickCategory(cat) {
            const container = document.getElementById('quickChips');
            const items = quickData[cat] || [];
            container.innerHTML = items.map(item => `
                <button class="chip" onclick="vibrate(); applyQuickPhrase('${item.uk.replace(/'/g, "\\'")}', '${item.sq.replace(/'/g, "\\'")}')">
                    ${item.uk}
                </button>
            `).join('');
        }

        function applyQuickPhrase(ukText, sqText) {
            const srcLang = document.getElementById('srcLang').value;
            const tgtLang = document.getElementById('tgtLang').value;
            if (srcLang === 'uk' && tgtLang === 'sq') {
                document.getElementById('inputText').value = ukText;
                document.getElementById('outputText').innerText = sqText;
            } else {
                document.getElementById('inputText').value = ukText;
                translateText();
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('themeBtn').innerText = newTheme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeBtn').innerText = savedTheme === 'light' ? '☀️' : '🌙';

        function swapLanguages() {
            const src = document.getElementById('srcLang');
            const tgt = document.getElementById('tgtLang');
            const temp = src.value;
            src.value = tgt.value;
            tgt.value = temp;
            updateUI();
            if (document.getElementById('inputText').value.trim()) translateText();
        }

        function clearInput() {
            const srcLang = document.getElementById('srcLang').value;
            const t = uiTranslations[srcLang] || uiTranslations['uk'];
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').innerText = t.resultPlaceholder;
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                document.getElementById('inputText').value = event.results[0][0].transcript;
                stopRecording();
                translateText();
            };
            recognition.onerror = () => stopRecording();
            recognition.onend = () => stopRecording();
        }

        function toggleRecognition() {
            if (!recognition) return alert('Speech recognition not supported');
            if (isRecording) {
                recognition.stop();
                stopRecording();
            } else {
                const srcLangCode = document.getElementById('srcLang').value;
                recognition.lang = langSpeechCodes[srcLangCode] || 'en-US';
                recognition.start();
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
            }
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
        }

        async function translateText() {
            const text = document.getElementById('inputText').value.trim();
            const sourceLang = document.getElementById('srcLang').value;
            const targetLang = document.getElementById('tgtLang').value;
            const t = uiTranslations[sourceLang] || uiTranslations['uk'];

            if (!text) return;
            const outputDiv = document.getElementById('outputText');
            outputDiv.innerText = t.loading;

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, sourceLang, targetLang })
                });
                const data = await response.json();
                const resText = data.translation || t.error;
                outputDiv.innerText = resText;
                if (data.translation) saveToHistory(text, resText);
            } catch (err) {
                outputDiv.innerText = t.connectionError;
            }
        }

        async function speakResult() {
            const text = document.getElementById('outputText').innerText.trim();
            if (!text || text.includes("з'явиться") || text.includes("shfaqet") || text.includes("appear")) return;

            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (!response.ok) throw new Error('TTS error');
                const blob = await response.blob();
                const audio = new Audio(URL.createObjectURL(blob));
                await audio.play();
            } catch (err) {
                console.error("TTS Error:", err);
            }
        }

        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            if (text) navigator.clipboard.writeText(text);
        }

        async function shareResult() {
            const text = document.getElementById('outputText').innerText;
            if (navigator.share && text) {
                try { await navigator.share({ text }); } catch (e) {}
            } else { copyResult(); }
        }

        function saveToHistory(orig, trans) {
            let history = JSON.parse(localStorage.getItem('history') || '[]');
            if (history.length > 0 && history[0].orig === orig) return;
            history.unshift({ orig, trans });
            history = history.slice(0, 5);
            localStorage.setItem('history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('history') || '[]');
            const list = document.getElementById('historyList');
            list.innerHTML = history.map(item => `
                <div class="history-row" onclick="vibrate(); loadHistory('${item.orig.replace(/'/g, "\\'")}', '${item.trans.replace(/'/g, "\\'")}')">
                    <div class="history-row-orig">${item.orig}</div>
                    <div>${item.trans}</div>
                </div>
            `).join('');
        }

        function loadHistory(orig, trans) {
            document.getElementById('inputText').value = orig;
            document.getElementById('outputText').innerText = trans;
        }

        function clearHistory() {
            localStorage.removeItem('history');
            renderHistory();
        }

        updateUI();
        renderHistory();
        changeQuickCategory('cafe');
    </script>
</body>
</html>
