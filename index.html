<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voice Translator Executive</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030706">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #030706;
            --card-glass: rgba(6, 24, 18, 0.45);
            --card-border: rgba(52, 211, 153, 0.12);
            --text-main: #f8fafc;
            --text-title: #ffffff;
            --text-muted: #64748b;
            --accent-emerald: #34d399;
            
            /* Насичені смарагдові 3D-градієнти */
            --grad-mic: radial-gradient(circle at 35% 35%, #34d399 0%, #10b981 40%, #059669 75%, #022c22 100%);
            --grad-btn: linear-gradient(180deg, rgba(52, 211, 153, 0.25) 0%, rgba(16, 185, 129, 0.15) 100%);
            --grad-primary: linear-gradient(135deg, #10b981 0%, #059669 50%, #044e3a 100%);
            
            /* Соковите багаторівневе сяйво */
            --emerald-glow: 0 0 20px rgba(16, 185, 129, 0.45), 0 0 45px rgba(5, 150, 105, 0.25);
            --emerald-glow-strong: 0 0 25px rgba(52, 211, 153, 0.75), 0 0 60px rgba(16, 185, 129, 0.55);
            --glass-btn: rgba(255, 255, 255, 0.05);
            --glass-btn-hover: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --card-glass: #ffffff;
            --card-border: rgba(226, 232, 240, 0.8);
            --text-main: #0f172a;
            --text-title: #0f172a;
            --text-muted: #64748b;
            --accent-emerald: #059669;
            --glass-btn: #f1f5f9;
            --glass-btn-hover: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--bg-main);
            background-image: 
                radial-gradient(at 50% 0%, rgba(16, 185, 129, 0.18) 0px, transparent 60%),
                radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.12) 0px, transparent 50%);
            min-height: 100vh;
            margin: 0;
            padding: 16px 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .app-viewport {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-badge {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 12px #34d399;
        }

        .brand-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: -0.4px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-phrase-trigger {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: #34d399;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(8px);
        }

        .theme-btn {
            background: var(--glass-btn);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            width: 34px;
            height: 34px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        /* Перемикач мов */
        .lang-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 6px 10px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        select.lang-select {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        select.lang-select option {
            background: #061510;
            color: #f8fafc;
        }

        .swap-btn {
            background: var(--grad-primary);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-shadow: var(--emerald-glow);
        }

        /* Головна Скляна Картка */
        .main-card {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        textarea.input-area {
            width: 100%;
            height: 80px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 500;
            font-family: inherit;
            resize: none;
            outline: none;
            line-height: 1.4;
        }

        textarea.input-area::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .card-divider {
            height: 1px;
            background: var(--card-border);
        }

        .output-area {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
            min-height: 60px;
            color: var(--accent-emerald);
            word-break: break-word;
            text-shadow: 0 0 12px rgba(52, 211, 153, 0.3);
        }

        /* Лінійка Дій */
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
        }

        .action-group {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: var(--glass-btn);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .icon-btn-speak {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.35);
            color: var(--accent-emerald);
        }

        /* Анімована Еквалайзерна Хвиля */
        .wave-container {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 4px;
            height: 20px;
            margin: 4px 0 -4px 0;
        }

        .wave-container span {
            width: 3.5px;
            height: 100%;
            background: #34d399;
            border-radius: 3px;
            box-shadow: 0 0 10px #34d399;
            animation: wave 1s ease-in-out infinite;
        }

        .wave-container span:nth-child(2) { animation-delay: 0.15s; }
        .wave-container span:nth-child(3) { animation-delay: 0.3s; }
        .wave-container span:nth-child(4) { animation-delay: 0.45s; }

        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 20px; }
        }

        /* Панель Керування */
        .controls-bar {
            display: grid;
            grid-template-columns: 66px 1fr;
            gap: 12px;
            align-items: center;
            margin-top: 4px;
        }

        /* 3D Смарагдова Сфера Мікрофона */
        .btn-mic-main {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: var(--grad-mic);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-top: 1.5px solid rgba(255, 255, 255, 0.5);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--emerald-glow);
            position: relative;
            backdrop-filter: blur(8px);
        }

        .btn-mic-main svg {
            width: 26px;
            height: 26px;
            fill: white;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
        }

        /* Головна кнопка з об'ємним відблиском */
        .btn-translate-main {
            background: var(--grad-primary);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            color: white;
            border-radius: 20px;
            height: 66px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--emerald-glow);
            width: 100%;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .btn-mic-main:active, .btn-translate-main:active {
            transform: scale(0.95);
        }

        /* Соковите сяйво та пульсація під час розмови */
        .btn-mic-main.recording {
            animation: emeraldGlowPulse 1.2s infinite alternate;
        }

        @keyframes emeraldGlowPulse {
            0% {
                box-shadow: var(--emerald-glow);
                transform: scale(1);
            }
            100% {
                box-shadow: var(--emerald-glow-strong);
                transform: scale(1.06);
            }
        }

        /* Модальна Шторка */
        .sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 999;
        }

        .sheet-overlay.active { display: flex; }

        .sheet-content {
            background: #06120d;
            border-top: 1px solid var(--card-border);
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            max-height: 75vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sheet-title {
            font-size: 16px;
            font-weight: 800;
        }

        .sheet-close {
            background: var(--glass-btn);
            border: none;
            color: var(--text-main);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        .sheet-select {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            width: 100%;
        }

        .sheet-phrases-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }

        .sheet-phrase-item {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Історія */
        .history-card {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 12px 14px;
            backdrop-filter: blur(12px);
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .history-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 70px;
            overflow-y: auto;
        }

        .history-row {
            font-size: 12px;
            padding: 3px 0;
            cursor: pointer;
        }

        .history-row-orig {
            color: var(--text-muted);
            font-size: 10px;
        }
    </style>
</head>
