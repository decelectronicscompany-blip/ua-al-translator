<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Translator Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(-45deg, #090d16, #111827, #1e1b4b, #2e1065);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --accent-glow: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-danger: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            --btn-glass: rgba(255, 255, 255, 0.07);
            --btn-glass-hover: rgba(255, 255, 255, 0.15);
            --box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(-45deg, #e0e7ff, #f3e8ff, #fce7f3, #e0f2fe);
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.85);
            --btn-glass: rgba(0, 0, 0, 0.05);
            --btn-glass-hover: rgba(0, 0, 0, 0.1);
            --box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 18px;
            box-shadow: var(--box-shadow);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .title-block {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            background: var(--btn-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .lang-switcher {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 4px 8px;
            margin-bottom: 12px;
        }

        select.lang-select {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 2px;
            outline: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        select.lang-select option {
            background: #1e293b;
            color: #f8fafc;
        }

        .swap-btn {
            background: var(--btn-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .swap-btn:active {
            transform: rotate(180deg) scale(0.9);
        }

        .input-card, .result-card {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 85px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 44px 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn {
            border: none;
            border-radius: 16px;
            padding: 11px 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: white;
            background: var(--btn-glass);
            border: 1px solid var(--card-border);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-mic {
            background: var(--accent-danger);
            border: none;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.35);
        }

        .btn-translate {
            background: var(--accent-glow);
            border: none;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }

        .waveform {
            display: none;
            align-items: center;
            gap: 3px;
            height: 16px;
        }

        .waveform span {
            width: 3px;
            height: 100%;
            background: white;
            border-radius: 3px;
            animation: wave 1s ease-in-out infinite;
        }

        .waveform span:nth-child(2) { animation-delay: 0.15s; }
        .waveform span:nth-child(3) { animation-delay: 0.3s; }
        .waveform span:nth-child(4) { animation-delay: 0.45s; }

        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }

        .recording .waveform { display: flex; }
        .recording .mic-label { display: none; }

        .result-text {
            font-size: 15px;
            line-height: 1.4;
            min-height: 50px;
            max-height: 95px;
            overflow-y: auto;
            word-break: break-word;
        }

        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .result-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 8px;
            border-top: 1px solid var(--card-border);
            padding-top: 8px;
        }

        .icon-btn {
            background: var(--btn-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 7px 2px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }

        .history-section {
            border-top: 1px solid var(--card-border);
            padding-top: 10px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 90px;
            overflow-y: auto;
        }

        .history-item {
            background: var(--btn-glass);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .history-orig {
            color: var(--text-muted);
            font-size: 10px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title-block">
                <div class="status-dot"></div>
                <h1 class="title">Voice Translator</h1>
            </div>
            <button class="theme-toggle" onclick="vibrate(); toggleTheme();" id="themeBtn">🌙</button>
        </div>

        <div class="lang-switcher">
            <select class="lang-select" id="srcLang" onchange="vibrate(); updateUI();">
                <option value="uk">🇺🇦 Українська</option>
                <option value="sq">🇦🇱 Shqip</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="pl">🇵🇱 Polski</option>
                <option value="de">🇩🇪 Deutsch</option>
            </select>
            
            <button class="swap-btn" onclick="vibrate(); swapLanguages();">⇄</button>
            
            <select class="lang-select" id="tgtLang" onchange="vibrate();">
                <option value="sq">🇦🇱 Shqip</option>
                <option value="uk">🇺🇦 Українська</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="pl">🇵🇱 Polski</option>
                <option value="de">🇩🇪 Deutsch</option>
            </select>
        </div>

        <div class="input-card">
            <textarea id="inputText" placeholder="Введіть або продиктуйте текст..."></textarea>
        </div>

        <div class="controls-grid">
            <button class="btn" onclick="vibrate(); clearInput();" title="Clear">🗑️</button>
            <button class="btn btn-mic" id="micBtn" onclick="vibrate(); toggleRecognition();">
                <span class="mic-label" id="micTxt">🎤 Говорити</span>
                <div class="waveform">
                    <span></span><span></span><span></span><span></span>
                </div>
            </button>
            <button class="btn btn-translate" id="translateBtn" onclick="vibrate(); translateText();">Перекласти</button>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-text" id="outputText">Переклад з'явиться тут...</div>
            
            <div class="result-actions">
                <button class="icon-btn" onclick="vibrate(); speakResult();"><span id="speakTxt">🔊 Голос</span></button>
                <button class="icon-btn" onclick="vibrate(); copyResult();"><span id="copyTxt">📋 Копіювати</span></button>
                <button class="icon-btn" onclick="vibrate(); shareResult();"><span id="shareTxt">📲 Поділитись</span></button>
            </div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <span id="historyTitle">Останні переклади</span>
                <span id="clearHistoryTxt" style="cursor:pointer;" onclick="vibrate(); clearHistory();">Очистити</span>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        let isRecording = false;
        let recognition = null;

        const uiTranslations = {
            'uk': {
                placeholder: "Введіть або продиктуйте текст...",
                mic: "🎤 Говорити",
                translate: "Перекласти",
                resultPlaceholder: "Переклад з'явиться тут...",
                speak: "🔊 Голос",
                copy: "📋 Копіювати",
                share: "📲 Поділитись",
                history: "Останні переклади",
                clearHistory: "Очистити",
                loading: "Зачекайте...",
                error: "Помилка перекладу",
                connectionError: "Помилка з’єднання"
            },
            'sq': {
                placeholder: "Shkruani ose flisni tekstin...",
                mic: "🎤 Flisni",
                translate: "Përkthe",
                resultPlaceholder: "Përkthimi do të shfaqet këtu...",
                speak: "🔊 Zëri",
                copy: "📋 Kopjo",
                share: "📲 Ndaj",
                history: "Përkthimet e fundit",
                clearHistory: "Pastro",
                loading: "Ju lutem prisni...",
                error: "Gabim në përkthim",
                connectionError: "Gabim në lidhje"
            },
            'en': {
                placeholder: "Type or dictate text...",
                mic: "🎤 Speak",
                translate: "Translate",
                resultPlaceholder: "Translation will appear here...",
                speak: "🔊 Voice",
                copy: "📋 Copy",
                share: "📲 Share",
                history: "Recent translations",
                clearHistory: "Clear",
                loading: "Please wait...",
                error: "Translation error",
                connectionError: "Connection error"
            },
            'fr': {
                placeholder: "Saisissez ou dictez le texte...",
                mic: "🎤 Parler",
                translate: "Traduire",
                resultPlaceholder: "La traduction apparaîtra ici...",
                speak: "🔊 Voix",
                copy: "📋 Copier",
                share: "📲 Partager",
                history: "Traductions récentes",
                clearHistory: "Effacer",
                loading: "Veuillez patienter...",
                error: "Erreur de traduction",
                connectionError: "Erreur de connexion"
            },
            'it': {
                placeholder: "Scrivi o detta il testo...",
                mic: "🎤 Parla",
                translate: "Traduci",
                resultPlaceholder: "La traduzione apparirà qui...",
                speak: "🔊 Voce",
                copy: "📋 Copia",
                share: "📲 Condividi",
                history: "Traduzioni recenti",
                clearHistory: "Cancella",
                loading: "Attendere...",
                error: "Errore di traduzione",
                connectionError: "Errore di connessione"
            },
            'pl': {
                placeholder: "Wpisz lub podyktuj tekst...",
                mic: "🎤 Mów",
                translate: "Przetłumacz",
                resultPlaceholder: "Tłumaczenie pojawi się tutaj...",
                speak: "🔊 Głos",
                copy: "📋 Kopiuj",
                share: "📲 Udostępnij",
                history: "Ostatnie tłumaczenia",
                clearHistory: "Wyczyść",
                loading: "Czekaj...",
                error: "Błąd tłumaczenia",
                connectionError: "Błąd połączenia"
            },
            'de': {
                placeholder: "Text eingeben oder diktieren...",
                mic: "🎤 Sprechen",
                translate: "Übersetzen",
                resultPlaceholder: "Übersetzung erscheint hier...",
                speak: "🔊 Stimme",
                copy: "📋 Kopieren",
                share: "📲 Teilen",
                history: "Letzte Übersetzungen",
                clearHistory: "Löschen",
                loading: "Bitte warten...",
                error: "Übersetzungsfehler",
                connectionError: "Verbindungsfehler"
            }
        };

        const langSpeechCodes = {
            'uk': 'uk-UA',
            'sq': 'sq-AL',
            'en': 'en-US',
            'fr': 'fr-FR',
            'it': 'it-IT',
            'pl': 'pl-PL',
            'de': 'de-DE'
        };

        function vibrate() {
            if (navigator.vibrate) navigator.vibrate(12);
        }

        function updateUI() {
            const srcLang = document.getElementById('srcLang').value;
            const t = uiTranslations[srcLang] || uiTranslations['uk'];

            document.getElementById('inputText').placeholder = t.placeholder;
            document.getElementById('micTxt').innerText = t.mic;
            document.getElementById('translateBtn').innerText = t.translate;
            
            const currentOutput = document.getElementById('outputText').innerText;
            if (currentOutput.includes("з'явиться") || currentOutput.includes("shfaqet") || currentOutput.includes("appear") || currentOutput.includes("apparaîtra") || currentOutput.includes("apparirà") || currentOutput.includes("pojawia") || currentOutput.includes("erscheint")) {
                document.getElementById('outputText').innerText = t.resultPlaceholder;
            }

            document.getElementById('speakTxt').innerText = t.speak;
            document.getElementById('copyTxt').innerText = t.copy;
            document.getElementById('shareTxt').innerText = t.share;
            document.getElementById('historyTitle').innerText = t.history;
            document.getElementById('clearHistoryTxt').innerText = t.clearHistory;
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('themeBtn').innerText = newTheme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeBtn').innerText = savedTheme === 'light' ? '☀️' : '🌙';

        function swapLanguages() {
            const src = document.getElementById('srcLang');
            const tgt = document.getElementById('tgtLang');
            const temp = src.value;
            src.value = tgt.value;
            tgt.value = temp;
            updateUI();
            if (document.getElementById('inputText').value.trim()) translateText();
        }

        function clearInput() {
            const srcLang = document.getElementById('srcLang').value;
            const t = uiTranslations[srcLang] || uiTranslations['uk'];
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').innerText = t.resultPlaceholder;
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                document.getElementById('inputText').value = event.results[0][0].transcript;
                stopRecording();
                translateText();
            };

            recognition.onerror = () => stopRecording();
            recognition.onend = () => stopRecording();
        }

        function toggleRecognition() {
            if (!recognition) return alert('Speech recognition not supported');
            if (isRecording) {
                recognition.stop();
                stopRecording();
            } else {
                const srcLangCode = document.getElementById('srcLang').value;
                recognition.lang = langSpeechCodes[srcLangCode] || 'en-US';
                recognition.start();
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
            }
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
        }

        async function translateText() {
            const text = document.getElementById('inputText').value.trim();
            const sourceLang = document.getElementById('srcLang').value;
            const targetLang = document.getElementById('tgtLang').value;
            const t = uiTranslations[sourceLang] || uiTranslations['uk'];

            if (!text) return;

            const outputDiv = document.getElementById('outputText');
            const resultCard = document.getElementById('resultCard');
            
            outputDiv.innerText = t.loading;
            resultCard.classList.add('shimmer');

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, sourceLang, targetLang })
                });
                const data = await response.json();
                resultCard.classList.remove('shimmer');
                const resText = data.translation || t.error;
                outputDiv.innerText = resText;
                
                if (data.translation) {
                    saveToHistory(text, resText);
                    speakResult();
                }
            } catch (err) {
                resultCard.classList.remove('shimmer');
                outputDiv.innerText = t.connectionError;
            }
        }

        // Озвучення через OpenAI TTS API
        async function speakResult() {
            const text = document.getElementById('outputText').innerText.trim();
            if (!text || text.includes("з'явиться") || text.includes("shfaqet") || text.includes("appear") || text.includes("Зачекайте") || text.includes("prisni") || text.includes("patienter") || text.includes("Attendere") || text.includes("Czekaj") || text.includes("warten")) {
                return;
            }

            const speakBtn = document.getElementById('speakTxt');
            const originalText = speakBtn.innerText;
            speakBtn.innerText = "⏳ ...";

            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) throw new Error('TTS network request failed');

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                const audio = new Audio(audioUrl);
                
                await audio.play();
            } catch (err) {
                console.error("Помилка відтворення звуку:", err);
            } finally {
                speakBtn.innerText = originalText;
            }
        }

        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            if (text) {
                navigator.clipboard.writeText(text);
            }
        }

        async function shareResult() {
            const text = document.getElementById('outputText').innerText;
            if (navigator.share && text) {
                try { await navigator.share({ text }); } catch (e) {}
            } else {
                copyResult();
            }
        }

        function saveToHistory(orig, trans) {
            let history = JSON.parse(localStorage.getItem('history') || '[]');
            if (history.length > 0 && history[0].orig === orig) return;
            history.unshift({ orig, trans });
            history = history.slice(0, 10);
            localStorage.setItem('history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('history') || '[]');
            const list = document.getElementById('historyList');
            list.innerHTML = history.map(item => `
                <div class="history-item" onclick="vibrate(); loadHistory('${item.orig.replace(/'/g, "\\'")}', '${item.trans.replace(/'/g, "\\'")}')">
                    <div class="history-orig">${item.orig}</div>
                    <div>${item.trans}</div>
                </div>
            `).join('');
        }

        function loadHistory(orig, trans) {
            document.getElementById('inputText').value = orig;
            document.getElementById('outputText').innerText = trans;
        }

        function clearHistory() {
            localStorage.removeItem('history');
            renderHistory();
        }

        updateUI();
        renderHistory();
    </script>
</body>
</html>
