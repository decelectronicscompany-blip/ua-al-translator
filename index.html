<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Translator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --accent-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --accent-danger: linear-gradient(135deg, #ef4444 0%, #f43f5e 100%);
            --btn-secondary: rgba(255, 255, 255, 0.08);
            --btn-secondary-hover: rgba(255, 255, 255, 0.15);
            --box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 50%, #fce7f3 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.95);
            --btn-secondary: rgba(0, 0, 0, 0.05);
            --btn-secondary-hover: rgba(0, 0, 0, 0.1);
            --box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 16px;
            box-shadow: var(--box-shadow);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .title-block {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .title {
            font-size: 17px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            background: var(--btn-secondary);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .lang-switcher {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 4px 8px;
            margin-bottom: 12px;
        }

        select.lang-select {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 2px;
            outline: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        select.lang-select option {
            background: #1e293b;
            color: #f8fafc;
        }

        .swap-btn {
            background: var(--btn-secondary);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .input-card, .result-card {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 44px 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn {
            border: none;
            border-radius: 14px;
            padding: 10px 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: white;
            background: var(--btn-secondary);
            border: 1px solid var(--card-border);
        }

        .btn-mic {
            background: var(--accent-danger);
            border: none;
        }

        .btn-translate {
            background: var(--accent-primary);
            border: none;
        }

        .result-text {
            font-size: 15px;
            line-height: 1.4;
            min-height: 50px;
            max-height: 100px;
            overflow-y: auto;
            word-break: break-word;
        }

        .result-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 8px;
            border-top: 1px solid var(--card-border);
            padding-top: 8px;
        }

        .icon-btn {
            background: var(--btn-secondary);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 6px 2px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }

        .history-section {
            border-top: 1px solid var(--card-border);
            padding-top: 10px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 100px;
            overflow-y: auto;
        }

        .history-item {
            background: var(--btn-secondary);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .history-orig {
            color: var(--text-muted);
            font-size: 10px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title-block">
                <div class="status-dot"></div>
                <h1 class="title">Voice Translator</h1>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>

        <div class="lang-switcher">
            <select class="lang-select" id="srcLang" onchange="updateUI()">
                <option value="uk">🇺🇦 Українська</option>
                <option value="sq">🇦🇱 Shqip</option>
                <option value="en">🇬🇧 English</option>
            </select>
            
            <button class="swap-btn" onclick="swapLanguages()">⇄</button>
            
            <select class="lang-select" id="tgtLang">
                <option value="sq">🇦🇱 Shqip</option>
                <option value="uk">🇺🇦 Українська</option>
                <option value="en">🇬🇧 English</option>
            </select>
        </div>

        <div class="input-card">
            <textarea id="inputText" placeholder="Введіть або продиктуйте текст..."></textarea>
        </div>

        <div class="controls-grid">
            <button class="btn" onclick="clearInput()" title="Clear">🗑️</button>
            <button class="btn btn-mic" id="micBtn" onclick="toggleRecognition()"><span id="micTxt">🎤 Говорити</span></button>
            <button class="btn btn-translate" id="translateBtn" onclick="translateText()">Перекласти</button>
        </div>

        <div class="result-card">
            <div class="result-text" id="outputText">Переклад з'явиться тут...</div>
            
            <div class="result-actions">
                <button class="icon-btn" onclick="speakResult()"><span id="speakTxt">🔊 Голос</span></button>
                <button class="icon-btn" onclick="copyResult()"><span id="copyTxt">📋 Копіювати</span></button>
                <button class="icon-btn" onclick="shareResult()"><span id="shareTxt">📲 Поділитись</span></button>
            </div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <span id="historyTitle">Останні переклади</span>
                <span id="clearHistoryTxt" style="cursor:pointer;" onclick="clearHistory()">Очистити</span>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        let isRecording = false;
        let recognition = null;

        const uiTranslations = {
            'uk': {
                placeholder: "Введіть або продиктуйте текст...",
                mic: "🎤 Говорити",
                recording: "⏹ Запис...",
                translate: "Перекласти",
                resultPlaceholder: "Переклад з'явиться тут...",
                speak: "🔊 Голос",
                copy: "📋 Копіювати",
                share: "📲 Поділитись",
                history: "Останні переклади",
                clearHistory: "Очистити",
                loading: "Зачекайте...",
                error: "Помилка перекладу",
                connectionError: "Помилка з’єднання"
            },
            'sq': {
                placeholder: "Shkruani ose flisni tekstin...",
                mic: "🎤 Flisni",
                recording: "⏹ Regjistrim...",
                translate: "Përkthe",
                resultPlaceholder: "Përkthimi do të shfaqet këtu...",
                speak: "🔊 Zëri",
                copy: "📋 Kopjo",
                share: "📲 Ndaj",
                history: "Përkthimet e fundit",
                clearHistory: "Pastro",
                loading: "Ju lutem prisni...",
                error: "Gabim në përkthim",
                connectionError: "Gabim në lidhje"
            },
            'en': {
                placeholder: "Type or dictate text...",
                mic: "🎤 Speak",
                recording: "⏹ Recording...",
                translate: "Translate",
                resultPlaceholder: "Translation will appear here...",
                speak: "🔊 Voice",
                copy: "📋 Copy",
                share: "📲 Share",
                history: "Recent translations",
                clearHistory: "Clear",
                loading: "Please wait...",
                error: "Translation error",
                connectionError: "Connection error"
            }
        };

        const langSpeechCodes = {
            'uk': 'uk-UA',
            'sq': 'sq-AL',
            'en': 'en-US'
        };

        function updateUI() {
            const srcLang = document.getElementById('srcLang').value;
            const t = uiTranslations[srcLang] || uiTranslations['uk'];

            document.getElementById('inputText').placeholder = t.placeholder;
            if (!isRecording) document.getElementById('micTxt').innerText = t.mic;
            document.getElementById('translateBtn').innerText = t.translate;
            
            const currentOutput = document.getElementById('outputText').innerText;
            if (currentOutput.includes("з'явиться") || currentOutput.includes("shfaqet") || currentOutput.includes("appear")) {
                document.getElementById('outputText').innerText = t.resultPlaceholder;
            }

            document.getElementById('speakTxt').innerText = t.speak;
            document.getElementById('copyTxt').innerText = t.copy;
            document.getElementById('shareTxt').innerText = t.share;
            document.getElementById('historyTitle').innerText = t.history;
            document.getElementById('clearHistoryTxt').innerText = t.clearHistory;
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('themeBtn').innerText = newTheme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeBtn').innerText = savedTheme === 'light' ? '☀️' : '🌙';

        function swapLanguages() {
            const src = document.getElementById('srcLang');
            const tgt = document.getElementById('tgtLang');
            const temp = src.value;
            src.value = tgt.value;
            tgt.value = temp;
            updateUI();
            if (document.getElementById('inputText').value.trim()) translateText();
        }

        function clearInput() {
            const srcLang = document.getElementById('srcLang').value;
            const t = uiTranslations[srcLang] || uiTranslations['uk'];
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').innerText = t.resultPlaceholder;
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                document.getElementById('inputText').value = event.results[0][0].transcript;
                stopRecording();
                translateText();
            };

            recognition.onerror = () => stopRecording();
            recognition.onend = () => stopRecording();
        }

        function toggleRecognition() {
            if (!recognition) return alert('Speech recognition not supported');
            if (isRecording) {
                recognition.stop();
                stopRecording();
            } else {
                const srcLangCode = document.getElementById('srcLang').value;
                const t = uiTranslations[srcLangCode] || uiTranslations['uk'];
                recognition.lang = langSpeechCodes[srcLangCode] || 'en-US';
                recognition.start();
                isRecording = true;
                document.getElementById('micTxt').innerText = t.recording;
            }
        }

        function stopRecording() {
            isRecording = false;
            const srcLangCode = document.getElementById('srcLang').value;
            const t = uiTranslations[srcLangCode] || uiTranslations['uk'];
            document.getElementById('micTxt').innerText = t.mic;
        }

        async function translateText() {
            const text = document.getElementById('inputText').value.trim();
            const sourceLang = document.getElementById('srcLang').value;
            const targetLang = document.getElementById('tgtLang').value;
            const t = uiTranslations[sourceLang] || uiTranslations['uk'];

            if (!text) return;

            const outputDiv = document.getElementById('outputText');
            outputDiv.innerText = t.loading;

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, sourceLang, targetLang })
                });
                const data = await response.json();
                const resText = data.translation || t.error;
                outputDiv.innerText = resText;
                
                if (data.translation) {
                    saveToHistory(text, resText);
                    speakResult();
                }
            } catch (err) {
                outputDiv.innerText = t.connectionError;
            }
        }

        function speakResult() {
            const text = document.getElementById('outputText').innerText;
            if (!text) return;
            const targetLangCode = document.getElementById('tgtLang').value;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langSpeechCodes[targetLangCode] || 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            if (text) {
                navigator.clipboard.writeText(text);
            }
        }

        async function shareResult() {
            const text = document.getElementById('outputText').innerText;
            if (navigator.share && text) {
                try { await navigator.share({ text }); } catch (e) {}
            } else {
                copyResult();
            }
        }

        function saveToHistory(orig, trans) {
            let history = JSON.parse(localStorage.getItem('history') || '[]');
            if (history.length > 0 && history[0].orig === orig) return;
            history.unshift({ orig, trans });
            history = history.slice(0, 10);
            localStorage.setItem('history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('history') || '[]');
            const list = document.getElementById('historyList');
            list.innerHTML = history.map(item => `
                <div class="history-item" onclick="loadHistory('${item.orig.replace(/'/g, "\\'")}', '${item.trans.replace(/'/g, "\\'")}')">
                    <div class="history-orig">${item.orig}</div>
                    <div>${item.trans}</div>
                </div>
            `).join('');
        }

        function loadHistory(orig, trans) {
            document.getElementById('inputText').value = orig;
            document.getElementById('outputText').innerText = trans;
        }

        function clearHistory() {
            localStorage.removeItem('history');
            renderHistory();
        }

        updateUI();
        renderHistory();
    </script>
</body>
</html>
