<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voice Translator Executive</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030706">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #030706;
            --card-glass: rgba(10, 30, 22, 0.55);
            --card-border: rgba(52, 211, 153, 0.18);
            --text-main: #f8fafc;
            --text-title: #ffffff;
            --text-muted: #94a3b8;
            --accent-emerald: #34d399;
            
            --switcher-bg: rgba(0, 0, 0, 0.5);
            --switcher-btn-inactive: #94a3b8;
            --switcher-btn-active-bg: rgba(16, 185, 129, 0.25);
            --switcher-btn-active-border: rgba(52, 211, 153, 0.4);
            --switcher-btn-active-text: #34d399;

            --grad-mic: linear-gradient(135deg, #10b981 0%, #059669 60%, #044e3a 100%);
            --grad-primary: linear-gradient(135deg, #10b981 0%, #059669 100%);
            
            --emerald-glow: 0 8px 25px rgba(16, 185, 129, 0.35);
            --glass-btn: rgba(255, 255, 255, 0.06);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --card-glass: #ffffff;
            --card-border: rgba(203, 213, 225, 0.9);
            --text-main: #0f172a;
            --text-title: #0f172a;
            --text-muted: #64748b;
            --accent-emerald: #047857;
            
            --switcher-bg: #e2e8f0;
            --switcher-btn-inactive: #475569;
            --switcher-btn-active-bg: #059669;
            --switcher-btn-active-border: #047857;
            --switcher-btn-active-text: #ffffff;

            --glass-btn: #f8fafc;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--bg-main);
            background-image: 
                radial-gradient(at 50% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 60%),
                radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.08) 0px, transparent 50%);
            min-height: 100vh;
            margin: 0;
            padding: 16px 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .app-viewport {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pwa-banner {
            display: none;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 16px;
            padding: 10px 14px;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
        }

        .pwa-banner-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-emerald);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-pwa-install {
            background: var(--grad-primary);
            border: none;
            color: white;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 3px;
            cursor: pointer;
            user-select: none;
        }

        .brand-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-badge {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 10px #34d399;
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 19px;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: -0.3px;
        }

        .brand-title-accent {
            background: linear-gradient(135deg, #34d399 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(52, 211, 153, 0.3));
        }

        .user-id-chip {
            font-size: 11px;
            font-weight: 800;
            color: #34d399;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.35);
            border-radius: 10px;
            padding: 3px 10px;
            cursor: pointer;
            width: fit-content;
            letter-spacing: 0.2px;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.15);
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .btn-header-icon {
            background: var(--glass-btn);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .mode-switcher {
            background: var(--switcher-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .mode-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--switcher-btn-inactive);
            padding: 9px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .mode-btn.active {
            background: var(--switcher-btn-active-bg);
            border-color: var(--switcher-btn-active-border);
            color: var(--switcher-btn-active-text);
        }

        .duo-speaker-badge {
            display: none;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 800;
            color: var(--accent-emerald);
            text-align: center;
        }

        .lang-bar {
            display: grid;
            grid-template-columns: 1fr 34px 1fr;
            align-items: center;
            gap: 8px;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 6px 10px;
            backdrop-filter: blur(12px);
        }

        select.lang-select {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        select.lang-select option {
            background: #061510;
            color: #f8fafc;
        }

        [data-theme="light"] select.lang-select option {
            background: #ffffff;
            color: #0f172a;
        }

        .swap-btn {
            background: var(--grad-primary);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0 auto;
            box-shadow: var(--emerald-glow);
        }

        .swap-btn svg { width: 16px; height: 16px; fill: white; }

        .main-card {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(16px);
        }

        textarea.input-area {
            width: 100%;
            height: 80px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 500;
            font-family: inherit;
            resize: none;
            outline: none;
            line-height: 1.4;
        }

        textarea.input-area::placeholder { color: var(--text-muted); font-weight: 400; }
        .card-divider { height: 1px; background: var(--card-border); }

        .output-area {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
            min-height: 60px;
            color: var(--accent-emerald);
            word-break: break-word;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
        }

        .action-group { display: flex; gap: 6px; }

        .icon-btn {
            background: var(--glass-btn);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .icon-btn-speak {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.35);
            color: var(--accent-emerald);
        }

        .wave-container {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 4px;
            height: 20px;
            margin: 4px 0 -4px 0;
        }

        .wave-container span {
            width: 3.5px;
            height: 100%;
            background: #34d399;
            border-radius: 3px;
            box-shadow: 0 0 10px #34d399;
            animation: wave 1s ease-in-out infinite;
        }

        .wave-container span:nth-child(2) { animation-delay: 0.15s; }
        .wave-container span:nth-child(3) { animation-delay: 0.3s; }
        .wave-container span:nth-child(4) { animation-delay: 0.45s; }

        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 20px; }
        }

        .controls-bar { display: grid; gap: 12px; align-items: center; margin-top: 4px; }
        .controls-bar.hand-center { grid-template-columns: 1fr 66px 1fr; }
        .controls-bar.hand-left { grid-template-columns: 66px 1fr; }
        .controls-bar.hand-right { grid-template-columns: 1fr 66px; }

        .btn-action-side {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 20px;
            height: 64px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-mic-main {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: var(--grad-mic);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--emerald-glow);
            justify-self: center;
        }

        .btn-mic-main svg { width: 26px; height: 26px; fill: white; }

        .btn-translate-main {
            background: var(--grad-primary);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            border-radius: 20px;
            height: 64px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--emerald-glow);
            width: 100%;
        }

        .btn-mic-main.recording {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
            animation: redPulse 1.2s infinite alternate;
        }

        @keyframes redPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }

        .history-card { background: var(--card-glass); border: 1px solid var(--card-border); border-radius: 18px; padding: 12px 14px; backdrop-filter: blur(12px); }
        .history-top { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        .history-items { display: flex; flex-direction: column; gap: 6px; max-height: 70px; overflow-y: auto; }
        .history-row { font-size: 12px; padding: 3px 0; cursor: pointer; }
        .history-row-orig { color: var(--text-muted); font-size: 10px; }

        .app-footer-single-line {
            margin-top: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-size: 10.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow-x: auto;
            padding: 4px 0;
        }

        .footer-link { color: var(--text-muted); text-decoration: underline; cursor: pointer; }

        .legal-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(16px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1002;
            padding: 16px;
        }

        .legal-modal-overlay.active { display: flex; }

        .legal-modal-card {
            background: #061510;
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: var(--text-main);
            font-size: 12px;
            line-height: 1.5;
        }

        [data-theme="light"] .legal-modal-card { background: #ffffff; }

        .legal-modal-title { font-size: 16px; font-weight: 800; color: var(--accent-emerald); }
        .btn-legal-close { background: var(--grad-primary); border: none; color: white; border-radius: 12px; height: 40px; font-weight: 800; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="app-viewport">
        <!-- Header -->
        <div class="header">
            <div class="brand" onclick="handleBrandClick();">
                <div class="brand-top">
                    <div class="brand-badge"></div>
                    <div class="brand-title">Voice <span class="brand-title-accent">Translator</span></div>
                </div>
                <div class="user-id-chip" onclick="event.stopPropagation(); vibrate(); showUserCodeInfo();">
                    ID <span id="userBadgeCode">0000</span> (<span id="userBadgeCount">15</span>x)
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-header-icon" onclick="vibrate(); cycleHandMode();" id="handBtn" title="Ергономіка">🖐️</button>
                <button class="btn-header-icon" onclick="vibrate(); toggleTheme();" id="themeBtn" title="Тема">🌙</button>
            </div>
        </div>

        <!-- Mode Switcher -->
        <div class="mode-switcher">
            <button class="mode-btn active" id="btnModeSolo" onclick="vibrate(); setAppMode('solo');">
                <span>🎙️</span> Solo Mode
            </button>
            <button class="mode-btn" id="btnModeDuo" onclick="vibrate(); setAppMode('duo');">
                <span>🎧</span> Duo Earbuds
            </button>
        </div>

        <!-- Language Bar -->
        <div class="lang-bar">
            <select class="lang-select" id="srcLang" onchange="vibrate(); updateUI();">
                <option value="uk" selected>🇺🇦 Українська</option>
                <option value="sq">🇦🇱 Shqip (Албанська)</option>
                <option value="en">🇬🇧 English (Англійська)</option>
                <option value="de">🇩🇪 Deutsch (Німецька)</option>
                <option value="it">🇮🇹 Italiano (Італійська)</option>
                <option value="pl">🇵🇱 Polski (Польська)</option>
                <option value="fr">🇫🇷 Français (Французька)</option>
            </select>
            
            <button class="swap-btn" onclick="vibrate(); swapLanguages();">
                <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
            </button>
            
            <select class="lang-select" id="tgtLang" onchange="vibrate();">
                <option value="sq" selected>🇦🇱 Shqip (Албанська)</option>
                <option value="uk">🇺🇦 Українська</option>
                <option value="en">🇬🇧 English (Англійська)</option>
                <option value="de">🇩🇪 Deutsch (Німецька)</option>
                <option value="it">🇮🇹 Italiano (Італійська)</option>
                <option value="pl">🇵🇱 Polski (Польська)</option>
                <option value="fr">🇫🇷 Français (Французька)</option>
            </select>
        </div>

        <!-- Main Card -->
        <div class="main-card">
            <textarea class="input-area" id="inputText" placeholder="Введіть або продиктуйте текст..."></textarea>
            
            <div class="wave-container" id="waveBox">
                <span></span><span></span><span></span><span></span>
            </div>

            <div class="card-divider"></div>
            
            <div class="output-area" id="outputText">Переклад з'явиться тут...</div>
            
            <div class="action-row">
                <button class="icon-btn" onclick="vibrate(); clearInput();" title="Clear">🗑️</button>
                <div class="action-group">
                    <button class="icon-btn icon-btn-speak" onclick="vibrate(); speakResult();"><span id="speakTxt">🔊 Озвучити</span></button>
                    <button class="icon-btn" onclick="vibrate(); copyResult();">📋</button>
                </div>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="controls-bar hand-center" id="controlsBar"></div>

        <!-- History Card -->
        <div class="history-card">
            <div class="history-top">
                <span id="historyTitle">Історія</span>
                <span id="clearHistoryTxt" style="cursor:pointer;" onclick="vibrate(); clearHistory();">Очистити</span>
            </div>
            <div class="history-items" id="historyList"></div>
        </div>

        <!-- Legal Footer -->
        <div class="app-footer-single-line">
            <span class="footer-link" onclick="openLegalModal('terms')">Terms</span> • 
            <span class="footer-link" onclick="openLegalModal('privacy')">Privacy</span> • 
            <span class="footer-link" onclick="openLegalModal('refund')">Refund Policy</span> • 
            <span class="footer-link" onclick="openLegalModal('contact')">Contact</span>
        </div>
    </div>

    <!-- Legal Modal -->
    <div class="legal-modal-overlay" id="legalModal">
        <div class="legal-modal-card">
            <div class="legal-modal-title" id="legalTitle">Legal Information</div>
            <div id="legalBody">Loading...</div>
            <button class="btn-legal-close" onclick="closeLegalModal()">Close</button>
        </div>
    </div>

    <script>
        let isRecording = false;
        let recognition = null;
        let handMode = localStorage.getItem('handMode') || 'center';
        
        const TESTER_IDS = ['7848', '5231'];
        let userRawCode = localStorage.getItem('userRawCode') || Math.floor(1000 + Math.random() * 9000).toString();
        localStorage.setItem('userRawCode', userRawCode);
        let userBalance = parseInt(localStorage.getItem('userBalance') ?? '15');

        function isTester() { return TESTER_IDS.includes(userRawCode); }

        function updateBalanceDisplay() {
            const badgeCode = document.getElementById('userBadgeCode');
            const badgeCount = document.getElementById('userBadgeCount');
            if (badgeCode) badgeCode.innerText = userRawCode;
            if (badgeCount) badgeCount.innerText = isTester() ? '∞' : userBalance;
        }

        function vibrate() { if (navigator.vibrate) navigator.vibrate(12); }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('themeBtn').innerText = newTheme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);
        }

        function swapLanguages() {
            const src = document.getElementById('srcLang');
            const tgt = document.getElementById('tgtLang');
            const temp = src.value;
            src.value = tgt.value;
            tgt.value = temp;
        }

        function clearInput() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').innerText = "Переклад з'явиться тут...";
        }

        async function translateText() {
            const text = document.getElementById('inputText').value.trim();
            const sourceLang = document.getElementById('srcLang').value;
            const targetLang = document.getElementById('tgtLang').value;

            if (!text) return;

            document.getElementById('outputText').innerText = "Зачекайте...";

            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|${targetLang}`);
                const data = await res.json();
                if (data && data.responseData) {
                    document.getElementById('outputText').innerText = data.responseData.translatedText;
                }
            } catch (e) {
                document.getElementById('outputText').innerText = "Помилка перекладу";
            }
        }

        function speakResult() {
            const text = document.getElementById('outputText').innerText.trim();
            if (!text || text.includes("з'явиться")) return;
            const targetLang = document.getElementById('tgtLang').value;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = targetLang;
            window.speechSynthesis.speak(utterance);
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;

            recognition.onresult = (event) => {
                document.getElementById('inputText').value = event.results[0][0].transcript;
                stopRecording();
                translateText();
            };

            recognition.onerror = () => stopRecording();
            recognition.onend = () => stopRecording();
        }

        function toggleRecognition() {
            if (!recognition) return alert('Speech recognition not supported');
            if (isRecording) {
                recognition.stop();
                stopRecording();
            } else {
                recognition.lang = document.getElementById('srcLang').value;
                try {
                    recognition.start();
                    isRecording = true;
                    renderControlsBar();
                    document.getElementById('waveBox').style.display = 'flex';
                } catch(e){}
            }
        }

        function stopRecording() {
            isRecording = false;
            renderControlsBar();
            document.getElementById('waveBox').style.display = 'none';
        }

        function cycleHandMode() {
            if (handMode === 'center') handMode = 'right';
            else if (handMode === 'right') handMode = 'left';
            else handMode = 'center';
            
            localStorage.setItem('handMode', handMode);
            renderControlsBar();
        }

        function renderControlsBar() {
            const bar = document.getElementById('controlsBar');
            if (!bar) return;
            
            const micSVG = isRecording ? 
                `<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>` : 
                `<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>`;

            bar.className = `controls-bar hand-${handMode}`;

            const micBtnHTML = `<button class="btn-mic-main ${isRecording ? 'recording' : ''}" onclick="vibrate(); toggleRecognition();">${micSVG}</button>`;
            const translateBtnHTML = `<button class="btn-translate-main" onclick="vibrate(); translateText();">Перекласти</button>`;
            const clearBtnHTML = `<button class="btn-action-side" onclick="vibrate(); clearInput();">Очистити</button>`;

            if (handMode === 'center') {
                bar.innerHTML = clearBtnHTML + micBtnHTML + translateBtnHTML;
            } else if (handMode === 'right') {
                bar.innerHTML = translateBtnHTML + micBtnHTML;
            } else {
                bar.innerHTML = micBtnHTML + translateBtnHTML;
            }
        }

        const legalTexts = {
            terms: { title: "Terms of Service", body: "<b>1. Service Description:</b> Real-time speech & text translation.<br><br><b>2. Plans:</b> Solo (€1.00/mo), Duo (€2.00)." },
            privacy: { title: "Privacy Policy", body: "<b>1. Processing:</b> Voice/text processed real-time.<br><b>2. Security:</b> Encrypted via 2Checkout." },
            refund: { title: "Refund Policy", body: "<b>Refunds:</b> Full refund within 14 days if service fails." },
            contact: { title: "Contact Us", body: "<b>Support:</b> support@voicetranslator.app<br>Durrës, Albania." }
        };

        function openLegalModal(type) {
            const data = legalTexts[type] || legalTexts['terms'];
            document.getElementById('legalTitle').innerHTML = data.title;
            document.getElementById('legalBody').innerHTML = data.body;
            document.getElementById('legalModal').classList.add('active');
        }

        function closeLegalModal() { document.getElementById('legalModal').classList.remove('active'); }

        function handleBrandClick() {
            const newId = prompt("Змінити ID:", userRawCode);
            if (newId) { userRawCode = newId; localStorage.setItem('userRawCode', userRawCode); location.reload(); }
        }

        updateBalanceDisplay();
        renderControlsBar();
    </script>
</body>
</html>
