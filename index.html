<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Translator Premium</title>
    
    <!-- PWA та Іконки -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090d16">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(-45deg, #090d16, #111827, #1e1b4b, #2e1065);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.5);
            --accent-glow: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-danger: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            --btn-glass: rgba(255, 255, 255, 0.06);
            --btn-glass-hover: rgba(255, 255, 255, 0.12);
            --box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(-45deg, #e0e7ff, #f3e8ff, #fce7f3, #e0f2fe);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.9);
            --btn-glass: rgba(0, 0, 0, 0.04);
            --btn-glass-hover: rgba(0, 0, 0, 0.08);
            --box-shadow: 0 15px 30px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 14px;
            box-shadow: var(--box-shadow);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .title-block {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            background: var(--btn-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .lang-switcher {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 6px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 2px 6px;
            margin-bottom: 8px;
        }

        select.lang-select {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 2px;
            outline: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        select.lang-select option {
            background: #1e293b;
            color: #f8fafc;
        }

        .swap-btn {
            background: var(--btn-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        /* Компактний чистий розмовник */
        .quick-section {
            margin-bottom: 8px;
        }

        .quick-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            padding: 0 2px;
        }

        .quick-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .quick-select {
            background: var(--btn-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 8px;
            padding: 2px 6px;
            font-size: 11px;
            outline: none;
            cursor: pointer;
        }

        .quick-select option {
            background: #1e293b;
            color: #f8fafc;
        }

        .quick-chips {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }

        .quick-chips::-webkit-scrollbar { display: none; }

        .chip-btn {
            background: var(--btn-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 4px 8px;
            font-size: 11px;
            white-space: nowrap;
            cursor: pointer;
        }

        .chip-btn:active { transform: scale(0.95); }

        .input-card, .result-card {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 65px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
        }

        textarea::placeholder { color: var(--text-muted); }

        .controls-grid {
            display: grid;
            grid-template-columns: 38px 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 9px 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: white;
            background: var(--btn-glass);
            border: 1px solid var(--card-border);
        }

        .btn:active { transform: scale(0.96); }

        .btn-mic {
            background: var(--accent-danger);
            border: none;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }

        .btn-translate {
            background: var(--accent-glow);
            border: none;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .waveform {
            display: none;
            align-items: center;
            gap: 2px;
            height: 14px;
        }

        .waveform span {
            width: 2.5px;
            height: 100%;
            background: white;
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }

        .waveform span:nth-child(2) { animation-delay: 0.15s; }
        .waveform span:nth-child(3) { animation-delay: 0.3s; }
        .waveform span:nth-child(4) { animation-delay: 0.45s; }

        @keyframes wave {
            0%, 100% { height: 3px; }
            50% { height: 14px; }
        }

        .recording .waveform { display: flex; }
        .recording .mic-label { display: none; }

        .result-text {
            font-size: 14px;
            line-height: 1.35;
            min-height: 42px;
            max-height: 75px;
            overflow-y: auto;
            word-break: break-word;
        }

        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .result-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 6px;
            border-top: 1px solid var(--card-border);
            padding-top: 6px;
        }

        .icon-btn {
            background: var(--btn-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 5px 2px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .history-section {
            border-top: 1px solid var(--card-border);
            padding-top: 8px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 70px;
            overflow-y: auto;
        }

        .history-item {
            background: var(--btn-glass);
            border-radius: 8px;
            padding: 5px 7px;
            font-size: 11px;
            cursor: pointer;
        }

        .history-orig {
            color: var(--text-muted);
            font-size: 9px;
            margin-bottom: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title-block">
                <div class="status-dot"></div>
                <h1 class="title">Voice Translator</h1>
            </div>
            <button class="theme-toggle" onclick="vibrate(); toggleTheme();" id="themeBtn">🌙</button>
        </div>

        <div class="lang-switcher">
            <select class="lang-select" id="srcLang" onchange="vibrate(); updateUI();">
                <option value="uk">🇺🇦 Українська</option>
                <option value="sq">🇦🇱 Shqip</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="pl">🇵🇱 Polski</option>
                <option value="de">🇩🇪 Deutsch</option>
            </select>
            
            <button class="swap-btn" onclick="vibrate(); swapLanguages();">⇄</button>
            
            <select class="lang-select" id="tgtLang" onchange="vibrate();">
                <option value="sq">🇦🇱 Shqip</option>
                <option value="uk">🇺🇦 Українська</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="pl">🇵🇱 Polski</option>
                <option value="de">🇩🇪 Deutsch</option>
            </select>
        </div>

        <!-- Оптимізований мінімалістичний розмовник -->
        <div class="quick-section">
            <div class="quick-top">
                <span class="quick-title">⚡ Швидкі фрази:</span>
                <select id="quickCategory" onchange="vibrate(); changeQuickCategory(this.value);" class="quick-select">
                    <option value="cafe">☕ Кафе / Ресторан</option>
                    <option value="market">🛒 Ринок / Магазини</option>
                    <option value="taxi">🚖 Таксі / Дорога</option>
                    <option value="hotel">🏠 Готель / Оренда</option>
                    <option value="sos">💊 Аптека / SOS</option>
                    <option value="basic">👋 Етикет / Базові</option>
                </select>
            </div>
            <div class="quick-chips" id="quickChips"></div>
        </div>

        <div class="input-card">
            <textarea id="inputText" placeholder="Введіть або продиктуйте текст..."></textarea>
        </div>

        <div class="controls-grid">
            <button class="btn" onclick="vibrate(); clearInput();" title="Clear">🗑️</button>
            <button class="btn btn-mic" id="micBtn" onclick="vibrate(); toggleRecognition();">
                <span class="mic-label" id="micTxt">🎤 Говорити</span>
                <div class="waveform">
                    <span></span><span></span><span></span><span></span>
                </div>
            </button>
            <button class="btn btn-translate" id="translateBtn" onclick="vibrate(); translateText();">Перекласти</button>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-text" id="outputText">Переклад з'явиться тут...</div>
            
            <div class="result-actions">
                <button class="icon-btn" onclick="vibrate(); speakResult();"><span id="speakTxt">🔊 Голос</span></button>
                <button class="icon-btn" onclick="vibrate(); copyResult();"><span id="copyTxt">📋 Копіювати</span></button>
                <button class="icon-btn" onclick="vibrate(); shareResult();"><span id="shareTxt">📲 Поділитись</span></button>
            </div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <span id="historyTitle">Останні переклади</span>
                <span id="clearHistoryTxt" style="cursor:pointer;" onclick="vibrate(); clearHistory();">Очистити</span>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

        function vibrate() {
            if (navigator.vibrate) navigator.vibrate(12);
        }

        function updateUI() {
            const srcLang = document.getElementById('srcLang').value;
            const t = uiTranslations[srcLang] || uiTranslations['uk'];

            document.getElementById('inputText').placeholder = t.placeholder;
            document.getElementById('micTxt').innerText = t.mic;
            document.getElementById('translateBtn').innerText = t.translate;
            
            const currentOutput = document.getElementById('outputText').innerText;
            if (currentOutput.includes("з'явиться") || currentOutput.includes("shfaqet") || currentOutput.includes("appear") || currentOutput.includes("apparaîtra") || currentOutput.includes("apparirà") || currentOutput.includes("pojawia") || currentOutput.includes("erscheint")) {
                document.getElementById('outputText').innerText = t.resultPlaceholder;
            }

            document.getElementById('speakTxt').innerText = t.speak;
            document.getElementById('copyTxt').innerText = t.copy;
            document.getElementById('shareTxt').innerText = t.share;
            document.getElementById('historyTitle').innerText = t.history;
            document.getElementById('clearHistoryTxt').innerText = t.clearHistory;
        }

        function changeQuickCategory(cat) {
            const container = document.getElementById('quickChips');
            const items = quickData[cat] || [];
            
            container.innerHTML = items.map(item => `
                <button class="chip-btn" onclick="vibrate(); applyQuickPhrase('${item.uk.replace(/'/g, "\\'")}', '${item.sq.replace(/'/g, "\\'")}')">
                    ${item.uk}
                </button>
            `).join('');
        }

        function applyQuickPhrase(ukText, sqText) {
            const srcLang = document.getElementById('srcLang').value;
            const tgtLang = document.getElementById('tgtLang').value;

            if (srcLang === 'uk' && tgtLang === 'sq') {
                document.getElementById('inputText').value = ukText;
                document.getElementById('outputText').innerText = sqText;
            } else {
                document.getElementById('inputText').value = ukText;
                translateText();
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('themeBtn').innerText = newTheme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeBtn').innerText = savedTheme === 'light' ? '☀️' : '🌙';

        function swapLanguages() {
            const src = document.getElementById('srcLang');
            const tgt = document.getElementById('tgtLang');
            const temp = src.value;
            src.value = tgt.value;
            tgt.value = temp;
            updateUI();
            if (document.getElementById('inputText').value.trim()) translateText();
        }

        function clearInput() {
            const srcLang = document.getElementById('srcLang').value;
            const t = uiTranslations[srcLang] || uiTranslations['uk'];
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').innerText = t.resultPlaceholder;
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                document.getElementById('inputText').value = event.results[0][0].transcript;
                stopRecording();
                translateText();
            };

            recognition.onerror = () => stopRecording();
            recognition.onend = () => stopRecording();
        }

        function toggleRecognition() {
            if (!recognition) return alert('Speech recognition not supported');
            if (isRecording) {
                recognition.stop();
                stopRecording();
            } else {
                const srcLangCode = document.getElementById('srcLang').value;
                recognition.lang = langSpeechCodes[srcLangCode] || 'en-US';
                recognition.start();
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
            }
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
        }

        async function translateText() {
            const text = document.getElementById('inputText').value.trim();
            const sourceLang = document.getElementById('srcLang').value;
            const targetLang = document.getElementById('tgtLang').value;
            const t = uiTranslations[sourceLang] || uiTranslations['uk'];

            if (!text) return;

            const outputDiv = document.getElementById('outputText');
            const resultCard = document.getElementById('resultCard');
            
            outputDiv.innerText = t.loading;
            resultCard.classList.add('shimmer');

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, sourceLang, targetLang })
                });
                const data = await response.json();
                resultCard.classList.remove('shimmer');
                const resText = data.translation || t.error;
                outputDiv.innerText = resText;
                
                if (data.translation) {
                    saveToHistory(text, resText);
                }
            } catch (err) {
                resultCard.classList.remove('shimmer');
                outputDiv.innerText = t.connectionError;
            }
        }

        async function speakResult() {
            const text = document.getElementById('outputText').innerText.trim();
            if (!text || text.includes("з'явиться") || text.includes("shfaqet") || text.includes("appear") || text.includes("Зачекайте") || text.includes("prisni") || text.includes("patienter") || text.includes("Attendere") || text.includes("Czekaj") || text.includes("warten")) {
                return;
            }

            const speakBtn = document.getElementById('speakTxt');
            const originalText = speakBtn.innerText;
            speakBtn.innerText = "⏳ ...";

            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) throw new Error('TTS network request failed');

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                const audio = new Audio(audioUrl);
                
                await audio.play();
            } catch (err) {
                console.error("Помилка відтворення звуку:", err);
            } finally {
                speakBtn.innerText = originalText;
            }
        }

        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            if (text) {
                navigator.clipboard.writeText(text);
            }
        }

        async function shareResult() {
            const text = document.getElementById('outputText').innerText;
            if (navigator.share && text) {
                try { await navigator.share({ text }); } catch (e) {}
            } else {
                copyResult();
            }
        }

        function saveToHistory(orig, trans) {
            let history = JSON.parse(localStorage.getItem('history') || '[]');
            if (history.length > 0 && history[0].orig === orig) return;
            history.unshift({ orig, trans });
            history = history.slice(0, 10);
            localStorage.setItem('history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('history') || '[]');
            const list = document.getElementById('historyList');
            list.innerHTML = history.map(item => `
                <div class="history-item" onclick="vibrate(); loadHistory('${item.orig.replace(/'/g, "\\'")}', '${item.trans.replace(/'/g, "\\'")}')">
                    <div class="history-orig">${item.orig}</div>
                    <div>${item.trans}</div>
                </div>
            `).join('');
        }

        function loadHistory(orig, trans) {
            document.getElementById('inputText').value = orig;
            document.getElementById('outputText').innerText = trans;
        }

        function clearHistory() {
            localStorage.removeItem('history');
            renderHistory();
        }

        // Ініціалізація
        updateUI();
        renderHistory();
        changeQuickCategory('cafe');
    </script>
</body>
</html>
