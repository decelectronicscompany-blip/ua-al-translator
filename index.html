<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voice Translator Executive</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030706">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #030706;
            --card-glass: rgba(6, 24, 18, 0.45);
            --card-border: rgba(52, 211, 153, 0.12);
            --text-main: #f8fafc;
            --text-title: #ffffff;
            --text-muted: #64748b;
            --accent-emerald: #34d399;
            
            --grad-mic: radial-gradient(circle at 35% 35%, #34d399 0%, #10b981 40%, #059669 75%, #022c22 100%);
            --grad-btn: linear-gradient(180deg, rgba(52, 211, 153, 0.25) 0%, rgba(16, 185, 129, 0.15) 100%);
            --grad-primary: linear-gradient(135deg, #10b981 0%, #059669 50%, #044e3a 100%);
            
            --emerald-glow: 0 0 20px rgba(16, 185, 129, 0.45), 0 0 45px rgba(5, 150, 105, 0.25);
            --emerald-glow-strong: 0 0 25px rgba(52, 211, 153, 0.75), 0 0 60px rgba(16, 185, 129, 0.55);
            --glass-btn: rgba(255, 255, 255, 0.05);
            --glass-btn-hover: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --card-glass: #ffffff;
            --card-border: rgba(226, 232, 240, 0.8);
            --text-main: #0f172a;
            --text-title: #0f172a;
            --text-muted: #64748b;
            --accent-emerald: #059669;
            --glass-btn: #f1f5f9;
            --glass-btn-hover: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--bg-main);
            background-image: 
                radial-gradient(at 50% 0%, rgba(16, 185, 129, 0.18) 0px, transparent 60%),
                radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.12) 0px, transparent 50%);
            min-height: 100vh;
            margin: 0;
            padding: 16px 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .app-viewport {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-badge {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 12px #34d399;
        }

        .brand-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: -0.4px;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .btn-phrase-trigger {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: #34d399;
            border-radius: 12px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(8px);
        }

        .btn-hand-toggle {
            background: var(--glass-btn);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 6px 9px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .theme-btn {
            background: var(--glass-btn);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            width: 34px;
            height: 34px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        /* Перемикач мов */
        .lang-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 6px 10px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        select.lang-select {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        select.lang-select option {
            background: #061510;
            color: #f8fafc;
        }

        .swap-btn {
            background: var(--grad-primary);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-shadow: var(--emerald-glow);
        }

        /* Головна Скляна Картка */
        .main-card {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        textarea.input-area {
            width: 100%;
            height: 80px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 500;
            font-family: inherit;
            resize: none;
            outline: none;
            line-height: 1.4;
        }

        textarea.input-area::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .card-divider {
            height: 1px;
            background: var(--card-border);
        }

        .output-area {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
            min-height: 60px;
            color: var(--accent-emerald);
            word-break: break-word;
            text-shadow: 0 0 12px rgba(52, 211, 153, 0.3);
        }

        /* Лінійка Дій */
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
        }

        .action-group {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: var(--glass-btn);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .icon-btn-speak {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.35);
            color: var(--accent-emerald);
        }

        /* Анімована Еквалайзерна Хвиля */
        .wave-container {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 4px;
            height: 20px;
            margin: 4px 0 -4px 0;
        }

        .wave-container span {
            width: 3.5px;
            height: 100%;
            background: #34d399;
            border-radius: 3px;
            box-shadow: 0 0 10px #34d399;
            animation: wave 1s ease-in-out infinite;
        }

        .wave-container span:nth-child(2) { animation-delay: 0.15s; }
        .wave-container span:nth-child(3) { animation-delay: 0.3s; }
        .wave-container span:nth-child(4) { animation-delay: 0.45s; }

        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 20px; }
        }

        /* Панель Керування */
        .controls-bar {
            display: grid;
            gap: 12px;
            align-items: center;
            margin-top: 4px;
        }

        .controls-bar.hand-center { grid-template-columns: 1fr 68px 1fr; }
        .controls-bar.hand-left { grid-template-columns: 68px 1fr; }
        .controls-bar.hand-right { grid-template-columns: 1fr 68px; }

        .btn-action-side {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 20px;
            height: 66px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-mic-main {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--grad-mic);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-top: 1.5px solid rgba(255, 255, 255, 0.5);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--emerald-glow);
            position: relative;
            backdrop-filter: blur(8px);
            justify-self: center;
        }

        .btn-mic-main svg {
            width: 26px;
            height: 26px;
            fill: white;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
        }

        .btn-translate-main {
            background: var(--grad-primary);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            color: white;
            border-radius: 20px;
            height: 66px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--emerald-glow);
            width: 100%;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .btn-mic-main:active, .btn-translate-main:active, .btn-action-side:active {
            transform: scale(0.95);
        }

        .btn-mic-main.recording {
            animation: emeraldGlowPulse 1.2s infinite alternate;
        }

        @keyframes emeraldGlowPulse {
            0% { box-shadow: var(--emerald-glow); transform: scale(1); }
            100% { box-shadow: var(--emerald-glow-strong); transform: scale(1.06); }
        }

        /* Модальна Шторка */
        .sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 999;
        }

        .sheet-overlay.active { display: flex; }

        .sheet-content {
            background: #06120d;
            border-top: 1px solid var(--card-border);
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            max-height: 75vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sheet-title {
            font-size: 16px;
            font-weight: 800;
        }

        .sheet-close {
            background: var(--glass-btn);
            border: none;
            color: var(--text-main);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        .sheet-select {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            width: 100%;
        }

        .sheet-phrases-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }

        .sheet-phrase-item {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Історія */
        .history-card {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 12px 14px;
            backdrop-filter: blur(12px);
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .history-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 70px;
            overflow-y: auto;
        }

        .history-row {
            font-size: 12px;
            padding: 3px 0;
            cursor: pointer;
        }

        .history-row-orig {
            color: var(--text-muted);
            font-size: 10px;
        }
    </style>
</head>

        const uiTranslations = {

                catCafe: "☕ Кафе та ресторани", catMarket: "🛒 Ринок та шопінг", catTaxi: "🚖 Таксі та транспорт", catHotel: "🏠 Готель та оренда", catSos: "💊 Аптека та SOS", catBasic: "👋 Етикет та розмова"
            },

                catCafe: "☕ Kafe & Restorante", catMarket: "🛒 Tregu & Blerjet", catTaxi: "🚖 Taksi & Transporti", catHotel: "🏠 Hoteli & Me qira", catSos: "💊 Farmacia & SOS", catBasic: "👋 Etiketa & Biseda"

                catCafe: "☕ Cafe & Dining", catMarket: "🛒 Market & Shopping", catTaxi: "🚖 Taxi & Transport", catHotel: "🏠 Hotel & Rental", catSos: "💊 Pharmacy & SOS", catBasic: "👋 Etiquette & Chat"
            },
            'de': { phrasesBtn: "📖 Phrasen", sheetTitle: "⚡ Schnelle Phrasen", clearBtn: "Löschen", placeholder: "Text eingeben oder diktieren...", translate: "Übersetzen", resultPlaceholder: "Übersetzung erscheint hier...", speak: "🔊 Anhören", history: "Verlauf", clearHistory: "Löschen", loading: "Bitte warten...", error: "Übersetzungsfehler", connectionError: "Verbindungsfehler",
                catCafe: "☕ Café & Restaurant", catMarket: "🛒 Markt & Einkaufen", catTaxi: "🚖 Taxi & Transport", catHotel: "🏠 Hotel & Unterkunft", catSos: "💊 Apotheke & SOS", catBasic: "👋 Etikette & Gespräch"
            },
            'it': { phrasesBtn: "📖 Frasi", sheetTitle: "⚡ Frasi Rapide", clearBtn: "Cancella", placeholder: "Scrivi o detta il testo...", translate: "Traduci", resultPlaceholder: "La traduzione apparirà qui...", speak: "🔊 Ascolta", history: "Cronologia", clearHistory: "Cancella", loading: "Attendere...", error: "Errore di traduzione", connectionError: "Errore di connessione",
                catCafe: "☕ Ristorante e Caffè", catMarket: "🛒 Mercato e Shopping", catTaxi: "🚖 Taxi e Trasporti", catHotel: "🏠 Hotel e Affitti", catSos: "💊 Farmacia e SOS", catBasic: "👋 Galateo e Chiacchiere"
            },
            'fr': { phrasesBtn: "📖 Phrases", sheetTitle: "⚡ Phrases Rapides", clearBtn: "Effacer", placeholder: "Saisissez ou dictez le texte...", translate: "Traduire", resultPlaceholder: "La traduction apparaîtra ici...", speak: "🔊 Écouter", history: "Historique", clearHistory: "Effacer", loading: "Veuillez patienter...", error: "Erreur de traduction", connectionError: "Erreur de connexion",
                catCafe: "☕ Café & Restaurant", catMarket: "🛒 Marché & Shopping", catTaxi: "🚖 Taxi & Transport", catHotel: "🏠 Hôtel & Location", catSos: "💊 Pharmacie & SOS", catBasic: "👋 Politesse & Discussion"
            },
            'pl': { phrasesBtn: "📖 Zwroty", sheetTitle: "⚡ Szybkie Zwroty", clearBtn: "Wyczyść", placeholder: "Wpisz lub podyktuj tekst...", translate: "Przetłumacz", resultPlaceholder: "Tłumaczenie pojawi się tutaj...", speak: "🔊 Słuchaj", history: "Historia", clearHistory: "Wyczyść", loading: "Czekaj...", error: "Błąd tłumaczenia", connectionError: "Błąd połączenia",
                catCafe: "☕ Kawiarnia i Restauracja", catMarket: "🛒 Targ i Zakupy", catTaxi: "🚖 Taksówka i Transport", catHotel: "🏠 Hotel i Wynajem", catSos: "💊 Apteka i SOS", catBasic: "👋 Etykieta i Rozmowa"
            }
        };

        const langSpeechCodes = { 
            'uk': 'uk-UA', 'sq': 'sq-AL', 'en': 'en-US', 'de': 'de-DE', 'it': 'it-IT', 'fr': 'fr-FR', 'pl': 'pl-PL', 'ru': 'ru-RU'
        };

        const quickDataBase = {
            cafe: [ "Рахунок, будь ласка", "Це було дуже смачно, дякую!", "Принесіть меню, будь ласка", "Воду без газу, будь ласка", "Дві кави еспресо", "Капучино з рослинним молоком", "Чи є у вас морепродукти?", "Де знаходиться вбиральня?", "Чи можна розрахуватися карткою?" ],
            market: [ "Скільки це коштує?", "Чи можна оплатити карткою?", "Ви приймаєте євро?", "Зробіть невеличку знижку, будь ласка", "Дайте пакет, будь ласка", "Я просто дивлюся, дякую", "Де найближчий банкомат?", "Можна це приміряти?" ],
            taxi: [ "Скільки коштує поїздка до центра?", "Зупиніться тут, будь ласка", "Увімкніть лічильник, будь ласка", "Скільки до аеропорту?", "Зачекайте мене тут 5 хвилин", "Як дістатися до найближчого пляжу?" ],
            hotel: [ "Я бронював номер на своє ім'я", "Який пароль від Wi-Fi?", "В номері не працює кондиціонер", "О котрій годині сніданок?", "Коли час виселення (check-out)?", "Чи можна залишити багаж на рецепції?" ],
            sos: [ "Де найближча аптека?", "Дайте ліки від головного болю", "Терміново викличте швидку допомогу!", "Мені погано, допоможіть будь ласка", "Потрібен пластир та антисептик" ],
            basic: [ "Добрий день!", "Дуже дякую за допомогу!", "Будь ласка", "Ви розмовляєте англійською?", "Я вас не розумію", "Вибачте", "Як вас звати?", "Гарного вам дня!" ]
        };

        // Автозапуск визначення мови користувача при вході
        function detectUserLanguage() {
            const savedSrc = localStorage.getItem('srcLang');
            if (savedSrc) return; // Якщо людина вже обирала мову раніше
            
            const userLang = (navigator.language || navigator.userLanguage || '').slice(0, 2).toLowerCase();
            const srcSelect = document.getElementById('srcLang');
            
            let matched = false;
            for (let i = 0; i < srcSelect.options.length; i++) {
                if (srcSelect.options[i].value === userLang) {
                    srcSelect.value = userLang;
                    matched = true;
                    break;
                }
            }
            if (!matched) srcSelect.value = 'en'; // За замовчуванням англійська для іноземців
        }

        function vibrate() { if (navigator.vibrate) navigator.vibrate(12); }

        function cycleHandMode() {
            if (handMode === 'center') handMode = 'right';
            else if (handMode === 'right') handMode = 'left';
            else handMode = 'center';
            
            localStorage.setItem('handMode', handMode);
            renderControlsBar();
        }

        function renderControlsBar() {
            const bar = document.getElementById('controlsBar');
            const handBtn = document.getElementById('handBtn');
            bar.className = `controls-bar hand-${handMode}`;

            const micHTML = `
                <button class="btn-mic-main ${isRecording ? 'recording' : ''}" id="micBtn" onclick="vibrate(); toggleRecognition();">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
            `;

            const translateHTML = `
                <button class="btn-translate-main" id="translateBtn" onclick="vibrate(); translateText();">Перекласти</button>
            `;

            const clearHTML = `
                <button class="btn-action-side" id="clearBtnSide" onclick="vibrate(); clearInput();">Очистити</button>
            `;

            if (handMode === 'center') {
                handBtn.innerText = '🖐️ Центр';
                bar.innerHTML = clearHTML + micHTML + translateHTML;
            } else if (handMode === 'right') {
                handBtn.innerText = '👉 Правша';
                bar.innerHTML = translateHTML + micHTML;
            } else {
                handBtn.innerText = '👈 Лівша';
                bar.innerHTML = micHTML + translateHTML;
            }

            updateUI();
        }

        function openPhrasesSheet() {
            document.getElementById('sheetOverlay').classList.add('active');
            renderSheetPhrases(document.getElementById('sheetCategory').value);
        }

        function closePhrasesSheet(e) {
            document.getElementById('sheetOverlay').classList.remove('active');
        }

        function renderSheetPhrases(cat) {
            const list = document.getElementById('sheetPhrasesList');
            const items = quickDataBase[cat] || [];
            
            list.innerHTML = items.map(phraseText => `
                <div class="sheet-phrase-item" onclick="vibrate(); selectPhrase('${phraseText.replace(/'/g, "\\'")}')">
                    <span>${phraseText}</span>
                    <span style="color:var(--accent-emerald); font-size:13px;">➔</span>
                </div>
            `).join('');
        }

        function selectPhrase(phraseText) {
            document.getElementById('inputText').value = phraseText;
            closePhrasesSheet();
            translateText();
        }

        function updateUI() {
            const srcLang = document.getElementById('srcLang').value;
            localStorage.setItem('srcLang', srcLang);
            
            const t = uiTranslations[srcLang] || uiTranslations['en'];
            document.getElementById('inputText').placeholder = t.placeholder;
            
            const btnT = document.getElementById('translateBtn');
            if (btnT) btnT.innerText = t.translate;

            const btnClear = document.getElementById('clearBtnSide');
            if (btnClear) btnClear.innerText = t.clearBtn;
            
            document.getElementById('phrasesBtnTxt').innerText = t.phrasesBtn;
            document.getElementById('sheetTitleTxt').innerText = t.sheetTitle;

            const currentOutput = document.getElementById('outputText').innerText;
            if (currentOutput.includes("з'явиться") || currentOutput.includes("shfaqet") || currentOutput.includes("appear") || currentOutput.includes("erscheint")) {
                document.getElementById('outputText').innerText = t.resultPlaceholder;
            }
            
            document.getElementById('speakTxt').innerText = t.speak;
            document.getElementById('historyTitle').innerText = t.history;
            document.getElementById('clearHistoryTxt').innerText = t.clearHistory;

            // Оновлення назв категорій у шторці
            const catSelect = document.getElementById('sheetCategory');
            if (catSelect && t.catCafe) {
                catSelect.options[0].text = t.catCafe;
                catSelect.options[1].text = t.catMarket;
                catSelect.options[2].text = t.catTaxi;
                catSelect.options[3].text = t.catHotel;
                catSelect.options[4].text = t.catSos;
                catSelect.options[5].text = t.catBasic;
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('themeBtn').innerText = newTheme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeBtn').innerText = savedTheme === 'light' ? '☀️' : '🌙';

        function swapLanguages() {
            const src = document.getElementById('srcLang');
            const tgt = document.getElementById('tgtLang');
            const temp = src.value;
            src.value = tgt.value;
            tgt.value = temp;
            updateUI();
            if (document.getElementById('inputText').value.trim()) translateText();
        }

        function clearInput() {
            const srcLang = document.getElementById('srcLang').value;
            const t = uiTranslations[srcLang] || uiTranslations['en'];
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').innerText = t.resultPlaceholder;
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                document.getElementById('inputText').value = event.results[0][0].transcript;
                stopRecording();
                translateText();
            };
            recognition.onerror = () => stopRecording();
            recognition.onend = () => stopRecording();
        }

        function toggleRecognition() {
            if (!recognition) return alert('Speech recognition not supported in this browser');
            if (isRecording) {
                recognition.stop();
                stopRecording();
            } else {
                const srcLangCode = document.getElementById('srcLang').value;
                recognition.lang = langSpeechCodes[srcLangCode] || 'uk-UA';
                recognition.start();
                isRecording = true;
                const mic = document.getElementById('micBtn');
                if (mic) mic.classList.add('recording');
                document.getElementById('waveBox').style.display = 'flex';
            }
        }

        function stopRecording() {
            isRecording = false;
            const mic = document.getElementById('micBtn');
            if (mic) mic.classList.remove('recording');
            document.getElementById('waveBox').style.display = 'none';
        }

        async function translateText() {
            const text = document.getElementById('inputText').value.trim();
            const sourceLang = document.getElementById('srcLang').value;
            const targetLang = document.getElementById('tgtLang').value;
            const t = uiTranslations[sourceLang] || uiTranslations['en'];

            if (!text) return;
            const outputDiv = document.getElementById('outputText');
            outputDiv.innerText = t.loading;

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, sourceLang, targetLang })
                });
                const data = await response.json();
                const resText = data.translation || t.error;
                outputDiv.innerText = resText;
                if (data.translation) saveToHistory(text, resText);
            } catch (err) {
                outputDiv.innerText = t.connectionError;
            }
        }

        async function speakResult() {
            const text = document.getElementById('outputText').innerText.trim();
            if (!text || text.includes("з'явиться") || text.includes("shfaqet") || text.includes("appear")) return;

            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (!response.ok) throw new Error('TTS error');
                const blob = await response.blob();
                const audio = new Audio(URL.createObjectURL(blob));
                await audio.play();
            } catch (err) {
                console.error("TTS Error:", err);
            }
        }

        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            if (text) navigator.clipboard.writeText(text);
        }

        async function shareResult() {
            const text = document.getElementById('outputText').innerText;
            if (navigator.share && text) {
                try { await navigator.share({ text }); } catch (e) {}
            } else { copyResult(); }
        }

        function saveToHistory(orig, trans) {
            let history = JSON.parse(localStorage.getItem('history') || '[]');
            if (history.length > 0 && history[0].orig === orig) return;
            history.unshift({ orig, trans });
            history = history.slice(0, 5);
            localStorage.setItem('history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('history') || '[]');
            const list = document.getElementById('historyList');
            list.innerHTML = history.map(item => `
                <div class="history-row" onclick="vibrate(); loadHistory('${item.orig.replace(/'/g, "\\'")}', '${item.trans.replace(/'/g, "\\'")}')">
                    <div class="history-row-orig">${item.orig}</div>
                    <div>${item.trans}</div>
                </div>
            `).join('');
        }

        function loadHistory(orig, trans) {
            document.getElementById('inputText').value = orig;
            document.getElementById('outputText').innerText = trans;
        }

        function clearHistory() {
            localStorage.removeItem('history');
            renderHistory();
        }

        detectUserLanguage();
        renderControlsBar();
        renderHistory();
    </script>
